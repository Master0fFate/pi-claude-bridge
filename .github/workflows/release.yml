name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Match the tag to package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the archives
        run: |
          npm pack --silent --ignore-scripts
          tar -xzf pi-claude-bridge-*.tgz
          mv package pi-claude-bridge
          zip -qr "pi-claude-bridge-$GITHUB_REF_NAME.zip" pi-claude-bridge
          tar -czf "pi-claude-bridge-$GITHUB_REF_NAME.tar.gz" pi-claude-bridge
          sha256sum pi-claude-bridge-$GITHUB_REF_NAME.* > SHA256SUMS.txt
          awk -v version="${GITHUB_REF_NAME#v}" '/^## /{found = ($2 == version); next} found' CHANGELOG.md | sed '/./,$!d' > notes.md
          test -s notes.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pi-claude-bridge-${{ github.ref_name }}.*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" pi-claude-bridge-$GITHUB_REF_NAME.* SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" pi-claude-bridge-$GITHUB_REF_NAME.* SHA256SUMS.txt --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
